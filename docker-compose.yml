version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: skillforge-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  python-service:
    build: ./python-service
    container_name: skillforge-python
    ports:
      - "8000:8000"

  ai-service:
    build: ./ai-service
    container_name: skillforge-ai
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PYTHON_SERVICE_URL=http://skillforge-python:8000
    depends_on:
      - python-service

  backend:
    build: ./backend
    container_name: skillforge-gateway
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=http://ai-service:8001/agent/recommend
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - ai-service

  frontend:
    build: ./frontend
    container_name: skillforge-ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  
    depends_on:
      - backend

volumes:
  mongo-data: